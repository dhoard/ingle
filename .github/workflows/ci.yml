name: CI

# Build + test Ingle on both supported platforms. There were no prebuilt releases and no CI when
# this landed, so this is also the first automated proof the macOS build keeps working — but the
# headline reason it exists is to keep the Linux port honest: a macOS-ism (a missing -lm, a glibc
# feature-test macro, a gcc -Werror gripe) that compiles on a Mac but breaks Linux fails here.
on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch supersedes an in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux x86_64 (gcc)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # The CORE build is dependency-free. build-essential = gcc + make; time = /usr/bin/time, used
      # by crucible's RSS leak oracle; libcurl is the only system lib the networking build needs.
      - name: Install core dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential time pkg-config \
            libfreetype-dev libcurl4-openssl-dev

      # --- Core: the dependency-free compiler + the full golden suite (must always pass) ---
      - name: Build (dev)
        run: make
      - name: Regression suite
        run: make test

      # --- The DB build (vendored SQLite, no system dep) is built BEFORE the self-hosting differential so the
      #     latter's cgen_c_run_db stage (self-hosted SQLite FFI band vs the DB VM) has build/inglec-db + the DB
      #     runtime to run against; otherwise that stage skips. (OFI-224 db-band guard.) ---
      - name: Database build (vendored SQLite)
        run: make db
      # The WEB build (headless, no raylib/curl) is built before the differential so its cgen_c_run_web
      # stage (self-hosted web FFI band vs the WEB VM) has build/inglec-web + the web runtime. (OFI-224.)
      - name: Web build (headless SSR)
        run: make web
      # --- Self-hosting bootstrap differential: compiler-shaped programs (recursive ASTs, symbol
      #     tables) run on both backends with byte-identical stdout. The drift guard for the staged
      #     port of the compiler into Ingle (docs/design/self-hosting.md). Includes the cgen_c_run_db
      #     and cgen_c_run_web stages now that the DB + web builds are present. ---
      - name: Self-hosting differential
        run: make selfhost

      # --- Bootstrap independence: Ingle rebuilds its own compiler from the checked-in seed with NO
      #     src/ frontend in the loop. Its step-3 fixed point is seed-STRICT, so an output-changing
      #     selfhost/cgen_c.ig commit that forgets `make bootstrap-refresh` reds it — this step is the
      #     tripwire that catches seed drift on Linux (macOS runs it via `make verify`). See OFI-224 G1. ---
      - name: Bootstrap independence (frontend-free fixed point)
        run: make bootstrap

      # --- OFI-224 G4 Stage A: the compiler the cutover ships as the default `inglec`. Build the CHECKED,
      #     FRONTEND-FREE compiler (build/compile_c-self, from selfhost/compile_c.ig via the seed-built
      #     inglec-self — no src/ frontend in its build) and smoke it end-to-end: it must reject type errors
      #     (exit 65) and compile+run every cgen_c_run fixture identically to the VM. Guards the shipped
      #     self-hosted toolchain, which CI otherwise never built. ---
      - name: Self-hosted compiler (frontend-free, checked)
        run: make test-compile-c-self

      # --- Concurrency: the multicore runtime (-pthread on Linux) + its correctness suite ---
      - name: Parallel build
        run: make parallel
      - name: Parallel suite
        run: make test-parallel

      # --- Verification gates (the project's own fuzzers/consistency checks) ---
      - name: Gate — opcheck (operand codec)
        run: make opcheck
      - name: Gate — ceilings (narrow-operand stress)
        run: make ceilings
      - name: Gate — ledger (Ptr linearity)
        run: make ledger
      - name: Gate — crucible (memory-ownership fuzzer)
        run: make crucible

      # --- Networking (libcurl only — no display dependency, portable everywhere) ---
      - name: Networking suite
        run: make test-net

      # --- Flagship graphics build. raylib is NOT packaged in Debian/Ubuntu, so build it from source
      #     (its CMake installs a raylib.pc that pkg-config then finds). Compile + link is the proof;
      #     the GUI needs a display, so it is not launched here. ---
      - name: Build raylib from source (not packaged on Debian/Ubuntu)
        run: |
          sudo apt-get install -y cmake git libgl1-mesa-dev libx11-dev \
            libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev
          git clone --depth 1 --branch 5.5 https://github.com/raysan5/raylib /tmp/raylib
          cmake -S /tmp/raylib -B /tmp/raylib/build \
            -DBUILD_SHARED_LIBS=ON -DBUILD_EXAMPLES=OFF -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/raylib/build -j"$(nproc)"
          sudo cmake --install /tmp/raylib/build
          sudo ldconfig
      - name: Flagship build (raylib + libcurl)
        run: make net-graphics

  macos:
    name: macOS arm64 (clang)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      # On macOS raylib IS packaged (Homebrew), so the flagship needs no source build.
      # HOMEBREW_NO_REQUIRE_TAP_TRUST silences the runner's tap-trust prompt (a pre-installed third-party
      # tap like aws/tap would otherwise make brew warn and, in a future release, refuse to proceed).
      - name: Install build dependencies
        env:
          HOMEBREW_NO_REQUIRE_TAP_TRUST: 1
        run: brew install pkg-config raylib freetype curl || true

      - name: Build (dev)
        run: make
      - name: Regression suite
        run: make test
      - name: Parallel suite
        run: make test-parallel
      - name: Full verify gate
        run: make verify
      - name: Self-hosted compiler (frontend-free, checked)
        run: make test-compile-c-self
      - name: Flagship build (raylib + libcurl)
        run: make net-graphics
